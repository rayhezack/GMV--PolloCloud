<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="lineage-payment-title lineage-payment-desc" id="data-lineage-payment-root"><title id="lineage-payment-title">支付看板依赖图</title><desc id="lineage-payment-desc">GMV 趋势和付费类型共享支付结果，注册拆分同时依赖支付结果校验与独立注册明细，支付链路使用独立漏斗及到期 cohort。</desc><defs>
      <style>#data-lineage-payment-root { color: #0d253d; font-family: Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
      #data-lineage-payment-root header p, #data-lineage-payment-root p.caption { font-size:14px;color:#61718a;line-height:1.8 }
      #data-lineage-payment-root section { margin-top:40px }
      #data-lineage-payment-root .diagram-container { max-width:100%;overflow-x:auto;border:1px solid #d9e1ec;border-radius:8px }
      #data-lineage-payment-root a { color:#533afd }
      @media print {
#data-lineage-payment-root .diagram-container { overflow:visible }
      #data-lineage-payment-root section { break-inside:avoid }
