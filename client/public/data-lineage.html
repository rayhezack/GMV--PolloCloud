<!doctype html><html lang="zh-CN"><head><meta http-equiv="Content-Security-Policy" content="script-src 'unsafe-inline' blob:"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pollo · 数据血缘</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#0d253d;font:14px Inter,system-ui,sans-serif}header{display:flex;align-items:center;gap:16px;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid #e3e8ee;background:#fafbfe}nav{display:flex;gap:4px;flex-wrap:wrap}button,a{font:inherit;color:inherit}button{border:0;background:transparent;border-radius:18px;padding:8px 12px;cursor:pointer;color:#61718a}button:hover{background:#f0f1f4;color:#0d253d}button[aria-pressed=true]{background:white;color:#533afd;box-shadow:0 2px 8px #0d253d0c}button:focus-visible,a:focus-visible{outline:2px solid #8d80d6;outline-offset:2px}a{margin-left:auto;color:#61718a;text-underline-offset:4px}iframe{display:block;width:100%;height:calc(100dvh - 64px);min-height:590px;border:0} @media(max-width:700px){iframe{height:calc(100dvh - 110px)}}
</style></head><body><header><nav aria-label="血缘主题"><button data-view="payment" aria-pressed="true">支付结果</button><button data-view="chain" aria-pressed="false">支付链路</button><button data-view="creative" aria-pressed="false">创作</button><button data-view="operations" aria-pressed="false">投放与动作</button></nav><a id="full" href="/lineage/payment.html" target="_blank" rel="noreferrer">全屏探索</a></header><iframe id="diagram" src="/lineage/payment.html" title="支付结果数据血缘"></iframe><script>
const frame=document.querySelector('#diagram'),link=document.querySelector('#full');document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));frame.src='/lineage/'+b.dataset.view+'.html';frame.title=b.textContent+'数据血缘';link.href=frame.src;}));
</script></body></html>
